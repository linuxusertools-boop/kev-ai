<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chat - Kev AI</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/chat.css">
</head>
<body>
<header class="top">
  <h1>Kev AI</h1>
  <nav class="nav"><a href="/home">Home</a><a href="/docs">Docs</a></nav>
  <span id="cid" class="small"></span>
</header>
<main class="chatpage">
  <div id="log" class="log" aria-live="polite"></div>
  <div class="send">
    <textarea id="text" rows="2" maxlength="4000" placeholder="Tulis pesan..."></textarea>
    <button id="go" class="primary">Kirim</button>
  </div>
  <div class="row between">
    <p id="msg" class="msg" role="alert"></p>
    <button id="wipe" class="ghost">Hapus memori</button>
  </div>
</main>
<script type="module" src="/js/chat.js"></script>
</body>
</html>
